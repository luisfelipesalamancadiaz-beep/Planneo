<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Prueba Auth Planneo</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
</head>
<body>
  <h2>Prueba de registro / login</h2>
  <input id="email" type="email" placeholder="correo">
  <input id="pass" type="password" placeholder="contraseña">
  <button onclick="registrar()">Crear cuenta</button>
  <button onclick="entrar()">Iniciar sesión</button>
  <pre id="log"></pre>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDlHZChuc600vie5rnDqyBXk4gypQ4tgc",
      authDomain: "planneo-a3bca.firebaseapp.com",
      projectId: "planneo-a3bca",
      storageBucket: "planneo-a3bca.firebasestorage.app",
      messagingSenderId: "594631604240",
      appId: "1:594631604240:web:2be7df45a75e284235b295"
    };
    firebase.initializeApp(firebaseConfig);

    function log(msg) {
      document.getElementById("log").textContent += msg + "\n";
      console.log(msg);
    }

    async function registrar() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("pass").value;
      try {
        const user = await firebase.auth().createUserWithEmailAndPassword(email, pass);
        log("Cuenta creada: " + user.user.email);
      } catch (e) {
        log("ERROR: " + e.code + " - " + e.message);
      }
    }

    async function entrar() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("pass").value;
      try {
        const user = await firebase.auth().signInWithEmailAndPassword(email, pass);
        log("Sesión iniciada: " + user.user.email);
      } catch (e) {
        log("ERROR: " + e.code + " - " + e.message);
      }
    }
  </script>
</body>
</html>
